<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kigarama Growers SACCO — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="brand">
            <img src="images/coffee-basket.jpg" alt="Kigarama Growers SACCO">
            <h1>Kigarama Growers SACCO</h1>
            <p>Coffee &amp; Matooke Farmers' Savings &amp; Cooperative</p>
        </div>

        <div id="alertBox"></div>

        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" class="btn full" id="loginBtn">Log In</button>
        </form>

        <p style="text-align:center;margin-top:12px;">
            <a href="forgot-password.html" style="font-size:.85rem;">Forgot your password?</a>
        </p>
    </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('loginBtn');
    function clearAlert() {
    // Add your alert clearing logic here, or leave it empty for now
    console.log("Alert cleared");
}
    clearAlert(alertBox);
    btn.disabled = true; btn.textContent = 'Logging in…';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
        const user = await apiRequest('/auth/login', { method: 'POST', body: { username, password } });
        window.location.href = dashboardForRole(user.role);
    } catch (err) {
        showAlert(alertBox, err.message);
        btn.disabled = false; btn.textContent = 'Log In';
    }
});

// If already logged in, skip straight to the right dashboard.
(async () => {
    try {
        const user = await apiRequest('/auth/me');
        window.location.href = dashboardForRole(user.role);
    } catch (e) { /* not logged in — stay on login page */ }
})();
</script>
</body>
</html>
