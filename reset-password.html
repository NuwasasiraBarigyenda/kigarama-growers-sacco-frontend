<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Kigarama Growers SACCO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="brand">
            <img src="images/coffee-basket.jpg" alt="Kigarama Growers SACCO">
            <h1>Reset Password</h1>
            <p>Enter the 6-digit code we sent to your email, along with your new password.</p>
        </div>

        <div id="alertBox"></div>

        <form id="resetForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com">

            <label for="code">Reset Code</label>
            <input type="text" id="code" required maxlength="6" placeholder="123456" style="letter-spacing:.3em;text-align:center;">

            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">

            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" required minlength="6">

            <button type="submit" class="btn full" id="submitBtn">Reset Password</button>
        </form>

        <p class="muted mt" style="text-align:center;">
            Didn't get a code? <a href="forgot-password.html">Request another</a><br>
            <a href="index.html">← Back to login</a>
        </p>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
// Pre-fill email if it was passed from the forgot-password page.
const params = new URLSearchParams(window.location.search);
if (params.get('email')) {
    document.getElementById('email').value = params.get('email');
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('submitBtn');
    clearAlert(alertBox);

    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('code').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
        showAlert(alertBox, 'Passwords do not match.');
        return;
    }

    btn.disabled = true; btn.textContent = 'Resetting…';

    try {
        await apiRequest('/auth/reset-password', { method: 'POST', body: { email, code, newPassword } });
        showAlert(alertBox, 'Password reset successfully! Redirecting to login…', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    } catch (err) {
        showAlert(alertBox, err.message);
        btn.disabled = false; btn.textContent = 'Reset Password';
    }
});
</script>
</body>
</html>
