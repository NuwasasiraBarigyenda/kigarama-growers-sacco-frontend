<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password — Kigarama Growers SACCO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="brand">
            <img src="images/coffee-basket.jpg" alt="Kigarama Growers SACCO">
            <h1>Forgot Password</h1>
            <p>Enter the email address on your SACCO account and we'll send you a reset code.</p>
        </div>

        <div id="alertBox"></div>

        <form id="forgotForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com">

            <button type="submit" class="btn full" id="submitBtn">Send Reset Code</button>
        </form>

        <p class="muted mt" style="text-align:center;">
            <a href="index.html">← Back to login</a>
        </p>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('submitBtn');
    clearAlert(alertBox);
    btn.disabled = true; btn.textContent = 'Sending…';

    const email = document.getElementById('email').value.trim();

    try {
        await apiRequest('/auth/forgot-password', { method: 'POST', body: { email } });
        showAlert(alertBox, 'If an account exists with that email, a reset code has been sent to it. Redirecting…', 'success');
        setTimeout(() => {
            window.location.href = 'reset-password.html?email=' + encodeURIComponent(email);
        }, 1500);
    } catch (err) {
        showAlert(alertBox, err.message);
        btn.disabled = false; btn.textContent = 'Send Reset Code';
    }
});
</script>
</body>
</html>
