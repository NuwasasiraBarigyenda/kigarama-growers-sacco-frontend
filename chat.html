<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages — Kigarama Growers SACCO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
    <div class="mobile-header">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">&#9776;</button>
        <span class="mobile-brand-title">Kigarama Growers SACCO</span>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="topbar" id="topbar"></div>
        <div class="page-banner">
            <h1>Messages</h1>
            <p>Chat with anyone in the SACCO — members, staff, and management. Pick a person from the list to start.</p>
        </div>

        <div class="card" style="padding:0;overflow:hidden;">
            <div class="chat-layout">
                <div class="chat-contacts" id="contactsList">
                    <div style="padding:12px;">
                        <input type="text" id="contactSearch" placeholder="Search people…">
                    </div>
                    <div class="empty-state">Loading contacts…</div>
                </div>
                <div class="chat-main">
                    <div class="chat-header" id="chatHeader">Select someone to start chatting</div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="empty-state">No conversation selected.</div>
                    </div>
                    <form class="chat-input-row" id="chatForm" style="display:none;">
                        <label class="file-btn" title="Attach PDF, Word doc, or image">
                            📎
                            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif" style="display:none;">
                        </label>
                        <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off">
                        <button type="submit" class="btn">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/topbar.js"></script>
<script>
let me = null;
let activeContactId = null;
let allContacts = [];
let pollTimer = null;

(async () => {
    me = await requireAuth(); // any role
    if (!me) return;
    renderSidebar(document.getElementById('sidebar'), me, 'chat');
    renderTopbar(me);
    await loadContacts();

    // If arriving from a notification click, open that conversation directly.
    const params = new URLSearchParams(window.location.search);
    const withId = params.get('with');
    if (withId) {
        const contact = allContacts.find(c => String(c.id) === withId);
        if (contact) openConversation(contact.id, contact.fullName, null);
    }
})();

async function loadContacts() {
    try {
        allContacts = await apiRequest('/chat/contacts');
        renderContacts('');
    } catch (e) {
        document.getElementById('contactsList').innerHTML = `<div class="empty-state">${escapeHtml(e.message)}</div>`;
    }
}

function renderContacts(filterText) {
    const list = document.getElementById('contactsList');
    const filtered = allContacts.filter(c =>
        !filterText || c.fullName.toLowerCase().includes(filterText) || c.username.toLowerCase().includes(filterText)
    );

    const searchBoxHtml = `<div style="padding:12px;"><input type="text" id="contactSearch" placeholder="Search people…" value="${escapeHtml(filterText)}"></div>`;

    if (filtered.length === 0) {
        list.innerHTML = searchBoxHtml + '<div class="empty-state">No matches.</div>';
    } else {
        list.innerHTML = searchBoxHtml + filtered.map(c => `
            <div class="chat-contact ${c.id === activeContactId ? 'active' : ''}" data-id="${c.id}" data-name="${escapeHtml(c.fullName)}">
                ${c.profilePicUrl ? `<img class="avatar" src="${c.profilePicUrl}" style="border-radius:50%;width:36px;height:36px;object-fit:cover;">` : `<div class="avatar">${initials(c.fullName)}</div>`}
                <div style="flex:1;">
                    <div>${escapeHtml(c.fullName)}</div>
                    <div class="muted" style="font-size:.75rem;">${roleLabel(c.role)}</div>
                </div>
                ${c.unreadCount > 0 ? `<span class="badge red">${c.unreadCount}</span>` : ''}
            </div>
        `).join('');
    }

    document.getElementById('contactSearch').addEventListener('input', (e) => renderContacts(e.target.value.trim().toLowerCase()));
    document.getElementById('contactSearch').focus();
    document.getElementById('contactSearch').selectionStart = document.getElementById('contactSearch').value.length;

    list.querySelectorAll('.chat-contact').forEach(el => {
        el.addEventListener('click', () => openConversation(el.dataset.id, el.dataset.name, el));
    });
}

function openConversation(id, name, el) {
    activeContactId = String(id);
    document.querySelectorAll('.chat-contact').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    document.getElementById('chatHeader').textContent = name;
    document.getElementById('chatForm').style.display = 'flex';
    loadMessages();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadMessages, 5000);
}

async function loadMessages() {
    if (!activeContactId) return;
    try {
        const messages = await apiRequest('/chat/conversation/' + activeContactId);
        const box = document.getElementById('chatMessages');
        box.innerHTML = messages.length ? messages.map(m => renderBubble(m)).join('') : '<div class="empty-state">No messages yet — say hello!</div>';
        box.scrollTop = box.scrollHeight;
        // Clear the unread badge for this contact locally.
        const contact = allContacts.find(c => String(c.id) === activeContactId);
        if (contact) contact.unreadCount = 0;
    } catch (e) { console.error(e); }
}

function renderBubble(m) {
    const mine = m.senderId === me.id;
    let attachment = '';
    if (m.attachmentUrl) {
        attachment = `<a class="attachment" href="${m.attachmentUrl}" target="_blank">📎 ${escapeHtml(m.attachmentName || 'Attachment')}</a>`;
    }
    return `
        <div class="chat-bubble ${mine ? 'mine' : 'theirs'}">
            ${m.message ? escapeHtml(m.message) : ''}
            ${attachment}
            <span class="time">${fmtDate(m.timestamp)}</span>
        </div>
    `;
}

document.getElementById('chatForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!activeContactId) return;
    const input = document.getElementById('messageInput');
    const fileInput = document.getElementById('fileInput');
    const text = input.value.trim();
    const file = fileInput.files[0];
    if (!text && !file) return;

    const form = new FormData();
    form.append('receiverId', activeContactId);
    if (text) form.append('message', text);
    if (file) form.append('file', file);

    try {
        await apiRequest('/chat/send', { method: 'POST', body: form, isForm: true });
        input.value = '';
        fileInput.value = '';
        await loadMessages();
    } catch (err) { alert(err.message); }
});
</script>
</body>
</html>
