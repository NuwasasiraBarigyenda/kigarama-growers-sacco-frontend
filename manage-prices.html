<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produce Prices — Kigarama Growers SACCO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
    <div class="mobile-header">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">&#9776;</button>
        <span class="mobile-brand-title">Kigarama Growers SACCO</span>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="topbar" id="topbar"></div>
        <div class="page-banner alt">
            <h1>Produce Price Manager</h1>
            <p>Update the coffee price per kilogram to track world-market fluctuations, and set matooke bunch prices by size.</p>
        </div>

        <div class="card-row">
            <div class="card">
                <h3>☕ Coffee Price (per kg)</h3>
                <div id="coffeeAlert"></div>
                <p class="muted">Current: <b id="currentCoffeePrice">—</b> (last updated <span id="coffeeUpdatedAt">—</span>)</p>
                <form id="coffeeForm">
                    <label for="newCoffeePrice">New Price (UGX / kg)</label>
                    <input type="number" id="newCoffeePrice" min="1" step="0.01" required>
                    <label for="coffeeNote">Note (optional)</label>
                    <input type="text" id="coffeeNote" placeholder="e.g. Reflects ICE Arabica futures rise">
                    <button type="submit" class="btn full mt">Update Coffee Price</button>
                </form>
            </div>

            <div class="card">
                <h3>🍌 Matooke Prices (per bunch)</h3>
                <div id="matookeAlert"></div>
                <form id="matookeForm">
                    <label for="smallPrice">Small Bunch (UGX)</label>
                    <input type="number" id="smallPrice" min="1" step="0.01">
                    <label for="mediumPrice">Medium Bunch (UGX)</label>
                    <input type="number" id="mediumPrice" min="1" step="0.01">
                    <label for="largePrice">Large Bunch (UGX)</label>
                    <input type="number" id="largePrice" min="1" step="0.01">
                    <button type="submit" class="btn full mt">Update Matooke Prices</button>
                </form>
            </div>
        </div>

        <div class="card">
            <h3>Coffee Price History</h3>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Date</th><th>Price / kg</th><th>Set By</th><th>Note</th></tr></thead>
                    <tbody id="historyBody"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/topbar.js"></script>
<script>
(async () => {
    const user = await requireAuth(['SUPER_ADMIN', 'ADMIN']);
    if (!user) return;
    renderSidebar(document.getElementById('sidebar'), user, 'prices');
    renderTopbar(user);
    await loadCurrent();
    await loadHistory();
})();

async function loadCurrent() {
    try {
        const prices = await apiRequest('/prices/current');
        document.getElementById('currentCoffeePrice').textContent = money(prices.coffeePerKg);
        document.getElementById('coffeeUpdatedAt').textContent = fmtDate(prices.coffeeUpdatedAt);
        document.getElementById('smallPrice').placeholder = money(prices.matooke.SMALL);
        document.getElementById('mediumPrice').placeholder = money(prices.matooke.MEDIUM);
        document.getElementById('largePrice').placeholder = money(prices.matooke.LARGE);
    } catch (e) { /* no prices yet */ }
}

async function loadHistory() {
    try {
        const history = await apiRequest('/prices/coffee/history');
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = history.length ? history.map(h => `
            <tr>
                <td>${fmtDate(h.effectiveAt)}</td>
                <td>${money(h.pricePerKg)}</td>
                <td class="muted">${escapeHtml(h.setBy || '—')}</td>
                <td class="muted">${escapeHtml(h.note || '')}</td>
            </tr>
        `).join('') : '<tr><td colspan="4" class="muted">No price history yet.</td></tr>';
    } catch (e) { console.error(e); }
}

document.getElementById('coffeeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('coffeeAlert');
    clearAlert(alertBox);
    const pricePerKg = parseFloat(document.getElementById('newCoffeePrice').value);
    const note = document.getElementById('coffeeNote').value.trim();
    try {
        await apiRequest('/prices/coffee', { method: 'POST', body: { pricePerKg, note } });
        showAlert(alertBox, 'Coffee price updated.', 'success');
        document.getElementById('coffeeForm').reset();
        await loadCurrent();
        await loadHistory();
    } catch (err) { showAlert(alertBox, err.message); }
});

document.getElementById('matookeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('matookeAlert');
    clearAlert(alertBox);
    const small = document.getElementById('smallPrice').value;
    const medium = document.getElementById('mediumPrice').value;
    const large = document.getElementById('largePrice').value;
    try {
        await apiRequest('/prices/matooke', {
            method: 'POST',
            body: {
                small: small ? parseFloat(small) : null,
                medium: medium ? parseFloat(medium) : null,
                large: large ? parseFloat(large) : null,
            }
        });
        showAlert(alertBox, 'Matooke prices updated.', 'success');
        document.getElementById('matookeForm').reset();
        await loadCurrent();
    } catch (err) { showAlert(alertBox, err.message); }
});
</script>
</body>
</html>
